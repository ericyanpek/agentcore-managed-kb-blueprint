name: Repository safety

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # The safety scan performs every content check through ripgrep and now
      # refuses to run without it, rather than reporting success having scanned
      # nothing.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Scan publishable files
        run: ./scripts/12_repository_safety_check.sh

      - name: Check bilingual README synchronization
        run: python3 scripts/13_check_readme_sync.py

      - name: Require paired README changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}" HEAD -- README.md README.en.md)"
          if [[ -n "${changed}" && "$(wc -l <<< "${changed}")" -ne 2 ]]; then
            printf 'README.md and README.en.md must be changed together.\n' >&2
            exit 1
          fi

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: Run unit tests
        run: python -m pytest tests -v

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: infra

      - name: Run infrastructure tests
        run: npx jest
        working-directory: infra

      - name: Synthesise CDK stacks
        run: npx cdk synth --all
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1
